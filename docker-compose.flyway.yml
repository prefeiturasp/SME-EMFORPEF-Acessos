version: "3.1"

services:
  acessos-flyway:
    container_name: acessos-flyway
    image: boxfuse/flyway:5.2.4
    command: -url=jdbc:postgresql://acessos-db:5432/acessos_db?user=postgres&password=postgres -locations='filesystem:/opt/scripts' -outOfOrder=true migrate
    volumes:
      - ./scripts:/opt/scripts
    networks:
      - sme-network
networks:
  sme-network:
    driver: bridge 
